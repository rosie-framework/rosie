[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rosie-framework"
version = "0.4.0"
description = "Lightweight ROS2-inspired robotics framework over Zenoh"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "eclipse-zenoh>=1.0.0",
  "pyyaml>=6.0",
  "starlette>=0.37",
  "uvicorn>=0.27",
  "mcap>=1.2",
]

[project.optional-dependencies]
# Heavy / role-specific only. Light host tools (viz, MCAP export) are in core.
camera = ["opencv-python-headless>=4.8"]
mcu = ["platformio>=6", "pyserial>=3.5"]
# Backward-compatible aliases (deps already in core).
viz = []
mcap = []
linux = ["lgpio>=0.2", "smbus2>=0.4"]
all = ["rosie-framework[camera,mcu,linux]"]

[project.scripts]
rosie = "rosie.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rosie*"]

[tool.setuptools.package-data]
rosie = ["data/*", "tools/viz/static/*", "agent/profiles/*"]
