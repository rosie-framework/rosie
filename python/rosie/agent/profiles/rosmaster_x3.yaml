# Yahboom ROSMASTER X3 (official yahboomcar ROS 2).
# Chassis: yahboomcar_bringup Mcnamu_driver_X3 → /cmd_vel
# EKF (robot_localization) fuses /odom_raw + IMU → /odom
# Nav2: yahboomcar_nav navigation_dwa_launch.py / navigation_teb_launch.py
# When AMCL is running, set pose: /amcl_pose so goto matches the map frame.
# Community Jazzy stack (automaticaddison/yahboom_rosmaster) uses
# /odometry/filtered instead of /odom — override odom in agent.yaml if so.
cmd_vel: /cmd_vel
odom: /odom
navigate_to_pose: /navigate_to_pose
frame_id: map
