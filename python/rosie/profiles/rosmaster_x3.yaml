# Yahboom ROSMASTER X3, vendor Humble image.
# Chassis driver subscribes /cmd_vel. EKF publishes /odom.
# When AMCL is running, override pose.topic to /amcl_pose and
# pose.type to geometry_msgs/msg/PoseWithCovarianceStamped.
distro: humble
transport: bridge
cmd_vel:
  topic: /cmd_vel
  type: geometry_msgs/msg/Twist
pose:
  topic: /odom
  type: nav_msgs/msg/Odometry
nav:
  action: /navigate_to_pose
  frame_id: map
link_loss: stop
link_loss_s: 1.0
bridge:
  allow:
    publishers: ["^/odom$", "^/amcl_pose$", "^.*/_action/status$"]
    subscribers: ["^/cmd_vel$"]
    action_servers: ["^/navigate_to_pose$"]
