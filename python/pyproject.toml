[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rosie-framework"
version = "0.5.0"
description = "Fleet layer and laptop tools for ROS 2 robots, over Zenoh"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "eclipse-zenoh>=1.0.0",
  "pyyaml>=6.0",
  "starlette>=0.37",
  "uvicorn>=0.27",
  "mcap>=1.2",
  "rosbags>=0.10",
]

[project.optional-dependencies]
# Heavy / role-specific only. Light host tools (viz, MCAP export) are in core.
camera = ["opencv-python-headless>=4.8"]
# The watchdog imports rclpy from the robot's ROS install. Use a venv
# created with --system-site-packages; there is no pip package to add.
robot = []
# Backward-compatible aliases (deps already in core).
viz = []
mcap = []
all = ["rosie-framework[camera,robot]"]

[project.scripts]
rosie = "rosie.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rosie*"]

[tool.setuptools.package-data]
rosie = ["data/*", "tools/viz/static/*", "profiles/*"]
