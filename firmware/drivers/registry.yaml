# Rosie driver / base / network inventory
# Validated by rosie.robot_config and printed by `rosie drivers list`.
# status: supported | planned
# platforms: list of mcu | linux (default: [mcu] if omitted)

drivers:
  - id: tb6612
    category: motors
    status: supported
    description: TB6612FNG dual H-bridge (2 channels; MCU GPIO or Pi BCM)
    yaml_key: motors.driver
    platforms: [mcu, linux]
    deps: []

  - id: pca9685
    category: motors
    status: supported
    description: PCA9685 I2C PWM HAT (Linux; magnitude PWM)
    yaml_key: motors.driver
    platforms: [linux]
    deps: []

  - id: python
    category: motors
    status: supported
    description: BYO Python MotorDriver (motors.class)
    yaml_key: motors.driver
    platforms: [linux]
    deps: []

  - id: l298n
    category: motors
    status: supported
    description: L298N dual H-bridge (ENA/IN1/IN2 + ENB/IN3/IN4)
    yaml_key: motors.driver
    platforms: [mcu]
    deps: []

  - id: drv8833
    category: motors
    status: planned
    description: DRV8833 dual H-bridge
    yaml_key: motors.driver
    platforms: [mcu]

  - id: quad_encoder
    category: encoders
    status: supported
    description: Quadrature A/B encoders via ESP32Encoder
    yaml_key: encoders
    platforms: [mcu]
    deps: ["madhephaestus/ESP32Encoder"]

  - id: gpio_quadrature
    category: encoders
    status: supported
    description: Quadrature A/B encoders via Pi GPIO (lgpio)
    yaml_key: encoders.driver
    platforms: [linux]
    deps: []

  - id: python
    category: encoders
    status: supported
    description: BYO Python EncoderReader (encoders.class)
    yaml_key: encoders.driver
    platforms: [linux]
    deps: []

  - id: mpu6050
    category: imu
    status: supported
    description: MPU6050 accel + gyro (yaw-rate fusion + optional 6-axis publish)
    yaml_key: imu.chip
    platforms: [mcu, linux]
    deps: []

  - id: python
    category: imu
    status: supported
    description: BYO Python ImuReader (imu.class)
    yaml_key: imu.chip
    platforms: [linux]
    deps: []

  - id: esp32s3_eye
    category: camera
    status: supported
    description: ESP32-S3-EYE DVP pinout (also Freenove ESP32-S3 CAM clones)
    yaml_key: camera.board
    aliases: [freenove_esp32s3_cam]
    platforms: [mcu]
    deps: []

  - id: custom
    category: camera
    status: supported
    description: Custom DVP pin map via camera.pins in robot.yaml
    yaml_key: camera.board
    platforms: [mcu]
    deps: []

  - id: picamera2
    category: camera
    status: supported
    description: Raspberry Pi CSI camera via picamera2 (apt python3-picamera2)
    yaml_key: camera.driver
    platforms: [linux]
    deps: []

  - id: v4l2
    category: camera
    status: supported
    description: USB / V4L2 webcam via OpenCV (rosie-framework[camera])
    yaml_key: camera.driver
    platforms: [linux]
    deps: []

  - id: python
    category: camera
    status: supported
    description: BYO Python CameraSource (camera.class)
    yaml_key: camera.driver
    platforms: [linux]
    deps: []

  - id: vl53l1x
    category: range
    status: supported
    description: ST VL53L1X ToF distance (I2C; multi via range.sensors + xshut)
    yaml_key: range.sensors.*.chip
    platforms: [mcu, linux]
    deps: ["pololu/VL53L1X"]

  - id: vl53l0x
    category: range
    status: supported
    description: ST VL53L0X ToF distance (I2C; multi via range.sensors + xshut)
    yaml_key: range.sensors.*.chip
    platforms: [mcu, linux]
    deps: ["pololu/VL53L0X"]

  - id: python
    category: range
    status: supported
    description: BYO Python RangeReader (range.sensors.*.class)
    yaml_key: range.sensors.*.chip
    platforms: [linux]
    deps: []

  - id: diff_drive
    category: base
    status: supported
    description: Differential-drive kinematics + odometry
    yaml_key: base.type
    platforms: [mcu, linux]

  - id: mecanum
    category: base
    status: planned
    description: Mecanum / omni (4 channels)
    yaml_key: base.type
    platforms: [mcu, linux]

  - id: ackermann
    category: base
    status: planned
    description: Ackermann steer + drive
    yaml_key: base.type
    platforms: [mcu, linux]

  - id: softap
    category: network
    status: supported
    description: ESP32 SoftAP (one-robot fleet on the robot AP)
    yaml_key: network.mode
    platforms: [mcu]

  - id: station
    category: network
    status: supported
    description: Wi-Fi station (fleet / dedicated AP)
    yaml_key: network.mode
    platforms: [mcu]
