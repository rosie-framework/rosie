# Rosie standard messages — single source of truth.
# Regenerate bindings: python3 interfaces/gen.py
#
# Field types: f32, f64, bool, str, i32, u32
# Optional fields: append ? (e.g. value: f32?)
#
# Every generated message also gets a top-level `stamp` (f64 seconds).
# Session.publish / publishJson fill stamp when missing.
# Prefer these types for cross-robot contracts; robot-specific payloads
# can still use plain JSON dicts when needed.
# stamp: wall-clock seconds on laptop; MCU typically uses millis()/1000.0

# ---------------------------------------------------------------------------
# Twist — planar body velocity command (typically on cmd_vel)
# ---------------------------------------------------------------------------
# Used by teleop and other velocity controllers. Ground robots map this to
# motor PWM. Keep 2D for MCU-friendly SoftAP payloads; add a 3D type later
# for drones rather than widening this message.
#   v: linear speed along robot forward axis (m/s); + forward, - reverse
#   w: yaw rate about vertical axis (rad/s); + left/CCW, - right/CW
Twist:
  v: f32
  w: f32

# ---------------------------------------------------------------------------
# Pose2D — planar pose estimate (typically on pose)
# ---------------------------------------------------------------------------
# Robot frame / odom frame as defined by the robot. theta is yaw only.
#   x:     meters
#   y:     meters
#   theta: radians (yaw); convention is robot-defined (often +CCW from +x)
Pose2D:
  x: f32
  y: f32
  theta: f32

# ---------------------------------------------------------------------------
# Log — human-readable status / debug line (typically on log)
# ---------------------------------------------------------------------------
#   level: e.g. "info", "warn", "error" (convention, not enforced)
#   msg:   free-form text
Log:
  level: str
  msg: str

# ---------------------------------------------------------------------------
# Cmd — discrete command / mode switch (typically on cmd)
# ---------------------------------------------------------------------------
# Lightweight RPC-ish ops. Common ops on the car: "stop", "zero",
# "heading_source", "camera_enable". Robots may define their own op strings.
#   op:    command name
#   value: optional numeric argument (bools may be sent as JSON bools instead)
Cmd:
  op: str
  value: f32?

# ---------------------------------------------------------------------------
# Goto — planar goal point (typically on goto)
# ---------------------------------------------------------------------------
# Asks the robot to drive to a waypoint in the same frame as Pose2D.
# Latest goal wins (preempts any in-progress goto). Hosts should set goal_id;
# if omitted, MobileBase assigns one. Completion is signaled on nav_result
# (pose.navigating / dist remain for progress).
#   x:        meters
#   y:        meters
#   goal_id:  optional attempt id (echoed on pose + nav_result)
Goto:
  x: f32
  y: f32
  goal_id: i32?

# ---------------------------------------------------------------------------
# NavResult — terminal outcome of a goto attempt (typically on nav_result)
# ---------------------------------------------------------------------------
# Published once when AUTO navigation ends. status convention:
#   "succeeded" | "canceled"  — emitted by MobileBase / rosie run
#   "aborted"                 — bridged Nav2 agents may emit this (rejected /
#                               missing action server / Nav2 abort); hosts must
#                               tolerate it. Native robots do not emit it.
#   goal_id: attempt id from Goto (or robot-assigned)
#   x, y:    optional pose at completion (meters)
NavResult:
  goal_id: i32
  status: str
  x: f32?
  y: f32?

# ---------------------------------------------------------------------------
# RobotPresence — robot heartbeat / membership (typically on presence)
# ---------------------------------------------------------------------------
# Published by each robot so hosts can discover live members of a fleet
# (one or more robots in a fleet). status is a short string convention: "ready", "fault",
# "offline". fleet_id is the robot's fleet.
#   robot_id: this robot's id
#   fleet_id: optional fleet id
#   status:   lifecycle / health string
RobotPresence:
  robot_id: str
  fleet_id: str?
  status: str

# ---------------------------------------------------------------------------
# LeaderClaim — fleet coordinator claim (typically on _fleet/coord/leader)
# ---------------------------------------------------------------------------
# Stub for leader election / handoff. Higher term wins when comparing claims.
#   robot_id: claimant
#   term:     monotonic election term
LeaderClaim:
  robot_id: str
  term: u32

# ---------------------------------------------------------------------------
# EncoderTicks — cumulative quadrature ticks (typically on encoders)
# ---------------------------------------------------------------------------
# Opt-in raw encoder telemetry (encoders.pub_hz). Diff-drive left/right counts.
#   left:  left wheel cumulative ticks
#   right: right wheel cumulative ticks
EncoderTicks:
  left: i32
  right: i32

# ---------------------------------------------------------------------------
# Imu — 6-axis accel + gyro sample (typically on imu)
# ---------------------------------------------------------------------------
# Opt-in IMU telemetry (imu.pub_hz). Body frame as mounted on the robot.
#   accel_*: m/s²
#   gyro_*:  rad/s
#   ok:      sensor healthy / last read succeeded
Imu:
  accel_x: f32
  accel_y: f32
  accel_z: f32
  gyro_x: f32
  gyro_y: f32
  gyro_z: f32
  ok: bool

# ---------------------------------------------------------------------------
# Range — single ToF / proximity sample (typically on range/<id>)
# ---------------------------------------------------------------------------
# Opt-in via range.sensors in robot.yaml. One topic per named sensor.
#   id:            sensor id from YAML (e.g. front_left)
#   range:         latest raw distance (meters)
#   range_median:  median of last 5 successful raw samples (meters)
#   min_range:     sensor / config lower limit (meters)
#   max_range:     sensor / config upper limit (meters)
#   ok:            last raw read succeeded
Range:
  id: str
  range: f32
  range_median: f32
  min_range: f32
  max_range: f32
  ok: bool
