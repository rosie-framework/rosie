# TurtleBot3, ROS 2 Humble (the image most TB3 kits still ship).
distro: humble
transport: bridge
cmd_vel:
  topic: /cmd_vel
  type: geometry_msgs/msg/Twist
pose:
  topic: /odom
  type: nav_msgs/msg/Odometry
nav:
  action: /navigate_to_pose
  frame_id: map
link_loss: stop_after
link_loss_s: 2.0
bridge:
  allow:
    publishers: ["^/odom$", "^/amcl_pose$", "^.*/_action/status$"]
    subscribers: ["^/cmd_vel$"]
    action_servers: ["^/navigate_to_pose$"]
