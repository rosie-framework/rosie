# Generic ROS 2 mobile base on Jazzy or Lyrical. Nav2's velocity topic is
# TwistStamped. Humble robots should use the turtlebot3 or rosmaster profiles.
distro: jazzy
transport: bridge
ros_namespace: ""
cmd_vel:
  topic: /cmd_vel
  type: geometry_msgs/msg/TwistStamped
pose:
  topic: /odom
  type: nav_msgs/msg/Odometry
nav:
  action: /navigate_to_pose
  type: nav2_msgs/action/NavigateToPose
  frame_id: map
camera:
  topic: /camera/image_raw/compressed
  type: sensor_msgs/msg/CompressedImage
link_loss: stop_after
link_loss_s: 2.0
cmd_vel_gate: false
bridge:
  allow:
    publishers:
      - "^/odom$"
      - "^/amcl_pose$"
      - "^/camera/image_raw/compressed$"
      - "^.*/_action/feedback$"
      - "^.*/_action/status$"
    subscribers:
      - "^/cmd_vel$"
    action_servers:
      - "^/navigate_to_pose$"
  rates:
    - "^.*/image.*=2"
